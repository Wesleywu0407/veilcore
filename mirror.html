<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veilcore — Mirror</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=IBM+Plex+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #05060c; overflow: hidden; }
    canvas { display: block; }
    /* width/height are not optional: a canvas is a replaced element, so with
       width:auto `inset: 0` lays it out at its intrinsic buffer size instead of
       stretching it, and on a 2x display you see the top-left quarter. */
    .mirror-gl { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    .mirror-overlay { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
    .mirror-video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; top: 0; left: 0; }
    .mirror-start {
      position: fixed; inset: 0; z-index: 2;
      display: grid; place-content: center; justify-items: center; gap: 16px;
      background: radial-gradient(circle at 50% 34%, #1d2438 0, #0d1220 30%, #05060c 74%);
      text-align: center; color: #cfd9ec; font-family: "IBM Plex Mono", monospace;
    }
    .mirror-start[hidden] { display: none; }
    .mirror-start h1 {
      margin: 0; font-family: "Cormorant Garamond", serif; font-weight: 400;
      font-size: clamp(2.6rem, 7vw, 4.4rem); color: #f3ead7; letter-spacing: .06em;
    }
    .mirror-kicker { margin: 0; font-size: 11px; letter-spacing: .32em; color: #8ab4ff; }
    .mirror-sub { margin: 0; max-width: 54ch; line-height: 1.9; font-size: 13px; color: #93a3c0; }
    .mirror-start button {
      margin-top: 6px; padding: 13px 32px; border: 1px solid #6f8fd0; border-radius: 2px;
      background: transparent; color: #ffe6b8; cursor: pointer;
      font: 500 13px/1 "IBM Plex Mono", monospace; letter-spacing: .22em;
    }
    .mirror-start button:hover { background: #6f8fd022; }
    .mirror-error { max-width: 46ch; padding: 10px 14px; border: 1px solid #6b3b34; color: #ff9c82; font-size: 12px; line-height: 1.6; }
    .mirror-error[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas class="mirror-gl" data-mirror-gl></canvas>
  <canvas class="mirror-overlay" data-mirror-overlay></canvas>
  <video class="mirror-video" data-mirror-video playsinline muted autoplay></video>

  <section class="mirror-start" data-mirror-start>
    <p class="mirror-kicker">VEILCORE · MIRROR</p>
    <h1>Only the Body</h1>
    <p class="mirror-sub">
      No runes, no bow, no rival, no clock. One duelist that copies your arm,
      your wrist and your fingers, and a panel of the numbers it is copying.
      This is where the tracking gets made to look like you; the duel only ever
      reads the same modules.
    </p>
    <button type="button" data-mirror-enter>OPEN THE MIRROR</button>
    <p class="mirror-error" data-mirror-error hidden></p>
  </section>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/mirror.js"></script>
</body>
</html>
